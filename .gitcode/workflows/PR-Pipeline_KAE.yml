                sh build.sh zlib clean
                sh build.sh gzip clean
      ut:
        name: ut
        if: ${{ default() }}
        runs-on: [ self-hosted, os=euler] # X86、X64、ARM或ARM64
        container:
          image: swr.cn-north-4.myhuaweicloud.com/cloud_boostkit/openeuler-24.03-lts-sp2:base
        select: selected_by_default
        #needs: [ sca-pr, malicious-scan, pre-commit]
        steps:
          - name: fast_checkout
            identifier: fast_checkout
            uses: checkout
            with: # 啥都不用写, 默认下载当前流水线触发仓
            # repository: 'https://test.gitcode.net/test_enterprise/label_test.git'
              ref: ${{atomgit.ref}}
            # path: repo
            # token: 代码仓token
            # ssh-key: ""
            # endpoint_id: ""
            # fetch-depth: 1
            # submodules: "false"
            # lfs: "false"
            # clean: "true"
          - name: ut
            run: |-
                echo 'hello'
                yum install gcc make kernel-devel libtool numactl-devel openssl-devel chrpath patch perl bzip2 make automake autoconf libtool m4 pkg-config  -y

