                export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib


                chmod +x build.sh


                sh build.sh uadk
                # sh build.sh engine
                sh build.sh zlib
                # sh build.sh gzip


                # ls /usr/local/
